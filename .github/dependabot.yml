# Weekly grouped update pull requests. ci gates each one; nothing merges or
# publishes on its own. Security updates are raised as soon as an advisory lands,
# regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Let a new release age a week before proposing it (time for a malicious or
    # broken publish to be caught and pulled).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # 2026-10-26: TypeScript 7.0 is held back. typescript-eslint 8.72.1 (latest and
    # canary, peer typescript ">=4.8.4 <6.1.0") throws "typescript-eslint does not
    # support TS 7.0" when loaded, and the typescript@7 package no longer exports
    # the compiler API (ts.sys, createProgram, readConfigFile) that
    # scripts/api-reference.mjs and scripts/verify-registry.mjs use. Remove this
    # ignore once typescript-eslint supports TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
