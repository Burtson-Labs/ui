# Weekly grouped update pull requests. ci gates each one; nothing merges or
# publishes on its own. Security updates are raised as soon as an advisory lands,
# regardless of this schedule.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Let a new release age a week before proposing it (time for a malicious or
    # broken publish to be caught and pulled).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # 2026-10-26: TypeScript 7.0 is held back. typescript-eslint 8.72.1 (latest and
    # canary, peer typescript ">=4.8.4 <6.1.0") throws "typescript-eslint does not
    # support TS 7.0" when loaded, and the typescript@7 package no longer exports
    # the compiler API (ts.sys, createProgram, readConfigFile) that
    # scripts/api-reference.mjs and scripts/verify-registry.mjs use. Remove this
    # ignore once typescript-eslint supports TypeScript 7.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # 2026-10-26: ESLint 10 is held back. @burtson-labs/frontend-standards (the
      # shared config) depends on eslint-plugin-import 2.32, eslint-plugin-jsx-a11y
      # 6.10 and eslint-plugin-react 7.37, none of which supports ESLint 10 (peer
      # eslint <=9; react's version detection crashes on 10 with
      # "contextOrFilename.getFilename is not a function"). Either those plugins
      # ship ESLint 10 releases or frontend-standards moves to maintained
      # replacements (eslint-plugin-import-x, @eslint-react); remove both ignores
      # then. @eslint/js 10 is ESLint-10-only, so it moves with eslint.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      dependencies:
        dependency-type: production
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']
